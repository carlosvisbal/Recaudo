services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      TZ: America/Bogota
      SQLITE_PATH: /app/data/db.sqlite3
      GUNICORN_WORKERS: "2"
      DJANGO_SECRET_KEY: "mFfmXpIGNJMhsXsChtTVZ5PdsLl3DExE5bCxcA3DKnDq8dPRjwqcghJIjQCQO9nJ"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "Skorpion18***"
      ADMIN_EMAIL: "admin@localhost"
      ORGANIZATION_NAME: "Fundación Recaudo"
    ports:
      - "${RECAUDO_PORT:-8010}:8000"
    volumes:
      - recaudo-media:/app/media
      - recaudo-sqlite:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    build: ./cloudflared
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  recaudo-sqlite:
  recaudo-media:
